name: CI

on:
  push:
    branches: [main, feat/pilot-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate local synthetic configuration
        run: |
          cp infrastructure/.env.example infrastructure/.env
          ./scripts/validate.sh

  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest pytest-cov
          python -m pip install -e 'backend[test]'
      - name: Format, lint and typecheck
        run: |
          ruff format --check backend/src database tests/unit scripts/*.py
          ruff check backend/src database tests/unit scripts/*.py
          mypy backend scripts/load_test_50k.py scripts/validate_ingestion_governance.py
      - name: Run backend unit tests
        env:
          APP_ENV: test
          PYTHONPATH: backend/src:.
        run: pytest tests/unit -q --disable-warnings --cov=backend/src --cov-report=xml --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage.xml
            pytest-results.xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  security-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove secret, dependency and image scans
        run: ./scripts/validate-security-scans.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-evidence
          path: docs/evidence/security/RESULTATS-SCANS-SECURITE.json

  docker-build:
    runs-on: ubuntu-latest
    needs: [validate-infrastructure, lint-and-unit-tests, security-scans]
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: boa-sme-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose-e2e-and-operations:
    runs-on: ubuntu-latest
    needs: [docker-build, frontend-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Prepare local synthetic environment
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Build, migrate and seed stack
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml build
          ./scripts/seed.sh
          source scripts/common.sh
          load_local_env
          compose up --detach
          while read -r service; do
            wait_for_healthy "$service" 300
          done < <(compose ps --services)
      - name: Run deterministic 500 SME pipeline
        run: ./scripts/run-pipeline.sh
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run all E2E journeys
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: ./node_modules/.bin/playwright test --config playwright.config.ts
      - name: Prove migration rollback
        run: ./scripts/validate-ml-migration-rollback.sh
      - name: Prove isolated backup and restore
        run: ./scripts/validate-backup-restore.sh
      - name: Prove operational readiness degradation and recovery
        run: ./scripts/validate-operational-readiness.sh
      - name: Collect Compose logs
        if: always()
        run: docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-e2e-operations-evidence
          path: |
            compose.log
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            docs/evidence/backup/RESULTATS-BACKUP-RESTORE.json
            docs/evidence/operations/RESULTATS-READINESS-OPERATIONNELLE.json
            docs/evidence/ml/RESULTATS-MIGRATION-ML-SHADOW.json
      - name: Cleanup
        if: always()
        run: docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml down --volumes --remove-orphans

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - validate-infrastructure
      - lint-and-unit-tests
      - frontend-build
      - security-scans
      - docker-build
      - compose-e2e-and-operations
    steps:
      - name: Require every delivery gate
        env:
          VALIDATE_RESULT: ${{ needs.validate-infrastructure.result }}
          BACKEND_RESULT: ${{ needs.lint-and-unit-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          SECURITY_RESULT: ${{ needs.security-scans.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          E2E_RESULT: ${{ needs.compose-e2e-and-operations.result }}
        run: |
          printf 'validate=%s backend=%s frontend=%s security=%s docker=%s e2e=%s\n' \
            "$VALIDATE_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" \
            "$SECURITY_RESULT" "$DOCKER_RESULT" "$E2E_RESULT"
          for result in \
            "$VALIDATE_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT" \
            "$SECURITY_RESULT" "$DOCKER_RESULT" "$E2E_RESULT"; do
            [[ "$result" == success ]] || exit 1
          done

  release-image-gate:
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [security-scans, quality-gate]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: security-scan-evidence
          path: evidence
      - name: Require a releasable image set
        run: |
          jq '{scanExecutionStatus,releaseStatus,images:.images}' evidence/RESULTATS-SCANS-SECURITE.json
          [[ $(jq -r '.scanExecutionStatus' evidence/RESULTATS-SCANS-SECURITE.json) == PASS ]]
          [[ $(jq -r '.releaseStatus' evidence/RESULTATS-SCANS-SECURITE.json) == READY ]]
